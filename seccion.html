<script>
async function init() {
  const params = new URLSearchParams(location.search);
  const cat = params.get("cat") || "";
  document.getElementById("titulo-cat").textContent = cat || "Sección";
  const { data: notas } = await sbClient.from("notas").select("*");
  const grid = document.getElementById("grid-seccion");
  (notas || [])
    .filter((n) => n.categoria === cat)
    .sort((a, b) => new Date(b.fecha) - new Date(a.fecha))
    .forEach((n) => {
      const a = document.createElement("a");
      a.href = `article.html?id=${n.id}`;
      a.className = "card-nota";
      a.innerHTML = `
        <div class="media">${n.imagen ? `<img src="${n.imagen}" alt="">` : "sin imagen"}</div>
        <h3>${n.titulo}</h3>
        <div class="cat">${n.localidad}</div>`;
      grid.appendChild(a);
    });
}
init();
</script>
