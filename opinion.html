<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opinión — 3804 Noticias</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="masthead">
  <div class="container">
    <a href="index.html" class="menu-toggle" aria-label="Volver"><i class="ti ti-arrow-left"></i></a>
    <a href="index.html" class="logo">380<span class="num4">4</span><span class="marca">Noticias</span></a>
    <span></span>
  </div>
</header>

<div class="seccion-titulo" style="margin-top:20px;">Opinión</div>

<div class="tabs-opinion">
  <button class="activo" data-tab="editoriales">Editoriales</button>
  <button data-tab="columnistas">Columnistas</button>
  <button data-tab="cartas">Cartas de Lectores</button>
</div>

<div class="panel-tab activo" id="panel-editoriales">
  <div class="grid-notas" id="grid-editoriales"></div>
</div>

<div class="panel-tab" id="panel-columnistas">
  <p class="intro-columnistas">Acá encontrás el análisis y la mirada de quienes escriben en 3804 Noticias. Tocá en cada columnista para ver todas sus notas.</p>
  <div class="grid-autores" id="grid-autores"></div>
</div>

<div class="panel-tab" id="panel-cartas">
  <div class="grid-notas" id="grid-cartas"></div>
</div>

<footer>
  <a href="#" aria-label="Facebook"><i class="ti ti-brand-facebook"></i></a>
  <a href="#" aria-label="Instagram"><i class="ti ti-brand-instagram"></i></a>
  <a href="#" aria-label="YouTube"><i class="ti ti-brand-youtube"></i></a>
  <span class="handle">/3804noticias</span>
</footer>

<nav class="bottom-nav">
  <a href="index.html"><i class="ti ti-home"></i>Inicio</a>
  <a href="index.html#secciones"><i class="ti ti-category"></i>Secciones</a>
  <a href="opinion.html" class="activo"><i class="ti ti-feather"></i>Opinión</a>
  <a href="https://wa.me/5493804844173" target="_blank" rel="noopener"><i class="ti ti-brand-whatsapp"></i>Contacto</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-init.js"></script>
<script>
document.querySelectorAll(".tabs-opinion button").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tabs-opinion button").forEach((b) => b.classList.remove("activo"));
    document.querySelectorAll(".panel-tab").forEach((p) => p.classList.remove("activo"));
    btn.classList.add("activo");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("activo");
  });
});

function cardNota(nota, mostrarAutor) {
  const a = document.createElement("a");
  a.href = `article.html?id=${nota.id}`;
  a.className = "card-nota";
  const autorFecha = mostrarAutor
    ? `<div class="autor-fecha">${nota.autor_nombre || "Lector"} · ${new Date(nota.fecha).toLocaleDateString("es-AR")}</div>`
    : "";
  a.innerHTML = `
    <div class="media">${nota.imagen ? `<img src="${nota.imagen}" alt="">` : "sin imagen"}</div>
    <h3>${nota.titulo}</h3>
    <div class="cat">${nota.categoria}</div>
    ${autorFecha}
  `;
  return a;
}

async function init() {
  const { data: notas } = await sbClient.from("notas").select("*");
  const { data: columnistas } = await sbClient.from("columnistas").select("*");

  const editoriales = (notas || []).filter((n) => n.categoria === "Editoriales");
  const cartas = (notas || []).filter((n) => n.es_carta);

  const gridEd = document.getElementById("grid-editoriales");
  if (editoriales.length === 0) {
    gridEd.innerHTML = `<p style="padding:0 0 20px;color:var(--text-muted);font-size:13px;">Todavía no hay editoriales publicados.</p>`;
  } else {
    editoriales.forEach((n) => gridEd.appendChild(cardNota(n, false)));
  }

  const gridAut = document.getElementById("grid-autores");
  (columnistas || []).forEach((c) => {
    const div = document.createElement("div");
    div.className = "card-autor";
    div.innerHTML = `
      <div class="avatar">${c.foto ? `<img src="${c.foto}" alt="">` : ""}</div>
      <h3>${c.nombre}</h3>
      <a class="ir-notas" href="columnista.html?id=${c.id}">Ir a notas</a>
    `;
    gridAut.appendChild(div);
  });
  if (!columnistas || columnistas.length === 0) {
    gridAut.innerHTML = `<p style="grid-column:1/-1;color:var(--text-muted);font-size:13px;">Todavía no hay columnistas cargados.</p>`;
  }

  const gridCartas = document.getElementById("grid-cartas");
  if (cartas.length === 0) {
    gridCartas.innerHTML = `<p style="padding:0 0 20px;color:var(--text-muted);font-size:13px;">Todavía no hay cartas de lectores publicadas.</p>`;
  } else {
    cartas.forEach((n) => gridCartas.appendChild(cardNota(n, true)));
  }
}
init();
</script>
</body>
</html>
