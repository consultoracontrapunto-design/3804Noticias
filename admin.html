<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar nota — 3804 Noticias</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{background:#f5f4f2;color:#1c1c1c;}

  header.masthead{background:#ffffff;border-bottom:1px solid #e8e6e2;}
  header.masthead .logo{color:#1c1c1c;}
  header.masthead .logo .marca{color:#8a8a8a;}

  .form-wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}

  .aviso{
    background:#fff;border:1px solid #e8e6e2;border-left:3px solid var(--red);
    border-radius:10px;padding:14px 16px;font-size:13px;color:#5c5c5c;margin-bottom:22px;line-height:1.5;
  }

  .campo{
    background:#fff;border:1px solid #e8e6e2;border-radius:12px;
    padding:16px;margin-bottom:14px;
  }

  label{display:block;font-size:12px;font-weight:600;color:#8a8a8a;margin:0 0 8px;text-transform:uppercase;letter-spacing:0.3px;}

  input[type=text],input[type=url],input[type=file],textarea,select{
    width:100%;background:#fafafa;border:1px solid #e0ddd8;color:#1c1c1c;
    padding:10px 12px;border-radius:8px;font-size:15px;font-family:inherit;
  }
  input[type=text]:focus,textarea:focus,select:focus{
    outline:none;border-color:var(--red);background:#fff;
  }
  textarea{min-height:110px;resize:vertical;}

  .fila-check{
    display:flex;align-items:center;gap:10px;background:#fff;
    border:1px solid #e8e6e2;border-radius:10px;padding:12px 14px;margin-bottom:10px;
  }
  .fila-check input{width:auto;accent-color:var(--red);}
  .fila-check label{margin:0;text-transform:none;font-size:14px;font-weight:500;color:#1c1c1c;}

  button.accion{
    width:100%;margin-top:8px;background:var(--red);color:#fff;border:none;
    padding:14px 16px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
  }
  button.accion:disabled{opacity:0.5;}

  .estado{margin-top:14px;font-size:13px;padding:12px 14px;border-radius:10px;display:none;line-height:1.4;}
  .estado.ok{display:block;background:#eafaf0;color:#1a7a42;border:1px solid #b7ecc8;}
  .estado.error{display:block;background:#fdecec;color:var(--red-dark);border:1px solid #f3b9bb;}
</style>
</head>
<body>

<header class="masthead">
  <div class="container">
    <a href="index.html" class="logo">380<span class="num4">4</span><span class="marca">Noticias</span> <span class="marca">· Carga</span></a>
  </div>
</header>

<div class="form-wrap">
  <div class="aviso">
    Completá el formulario y tocá "Publicar nota" — se guarda directo en el sitio, sin pasos extra.
  </div>

  <div class="campo">
    <label>Título</label>
    <input type="text" id="titulo">
  </div>

  <div class="campo">
    <label>Bajada (una línea, resumen corto)</label>
    <input type="text" id="bajada">
  </div>

  <div class="campo">
    <label>Cuerpo (podés usar párrafos &lt;p&gt;...&lt;/p&gt;)</label>
    <textarea id="cuerpo"></textarea>
  </div>

  <div class="campo">
    <label>Categoría</label>
    <select id="categoria">
      <option>Política</option>
      <option>Judiciales</option>
      <option>Economía</option>
      <option>Sociedad</option>
      <option>Deportes</option>
      <option>Cultura</option>
      <option>Editoriales</option>
    </select>
  </div>

  <div class="campo">
    <label>Localidad</label>
    <select id="localidad">
      <option>La Rioja Capital</option>
      <option>Sanagasta</option>
      <option>Chilecito</option>
      <option>Villa Unión</option>
      <option>Villa Castelli</option>
      <option>Vinchina</option>
      <option>Famatina</option>
      <option>Chañarmuyo</option>
      <option>Aimogasta</option>
      <option>San Blas de los Sauces</option>
      <option>Castro Barros</option>
      <option>Chamical</option>
      <option>Chepes</option>
      <option>Ulapes</option>
      <option>Otra</option>
    </select>
  </div>

  <div class="campo">
    <label>Foto de la nota</label>
    <input type="file" id="imagen" accept="image/*">
  </div>

  <div class="fila-check">
    <input type="checkbox" id="destacada">
    <label>Marcar como nota destacada de portada</label>
  </div>

  <div class="fila-check">
    <input type="checkbox" id="esColumna">
    <label>Es una columna de opinión (de un columnista)</label>
  </div>

  <div class="campo" id="campo-autor" style="display:none;">
    <label id="label-autor">ID del columnista (ver tabla columnistas)</label>
    <input type="text" id="autorId" placeholder="autor-001">
  </div>

  <div class="fila-check">
    <input type="checkbox" id="esCarta">
    <label>Es una carta de lectores</label>
  </div>

  <div class="campo" id="campo-autor-nombre" style="display:none;">
    <label id="label-autor-nombre">Nombre del lector que escribe</label>
    <input type="text" id="autorNombre" placeholder="Ej: Juan Pérez">
  </div>

  <button class="accion" id="publicar">Publicar nota</button>

  <div class="estado" id="estado"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-init.js"></script>
<script>
document.getElementById("esColumna").addEventListener("change", (e) => {
  document.getElementById("campo-autor").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("esCarta").addEventListener("change", (e) => {
  document.getElementById("campo-autor-nombre").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("publicar").addEventListener("click", async () => {
  const btn = document.getElementById("publicar");
  const estado = document.getElementById("estado");
  estado.className = "estado";
  estado.textContent = "";

  const titulo = document.getElementById("titulo").value.trim();
  if (!titulo) {
    estado.className = "estado error";
    estado.textContent = "Falta el título.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Publicando...";

  try {
    let imagenUrl = "";
    const archivo = document.getElementById("imagen").files[0];
    if (archivo) {
      const nombreArchivo = `${Date.now()}-${archivo.name.replace(/\s+/g, "-")}`;
      const { error: errorSubida } = await sbClient.storage.from("IMG").upload(nombreArchivo, archivo);
      if (errorSubida) throw errorSubida;
      const { data: urlData } = sbClient.storage.from("IMG").getPublicUrl(nombreArchivo);
      imagenUrl = urlData.publicUrl;
    }

    const id = "nota-" + Date.now();
    const nota = {
      id,
      titulo,
      bajada: document.getElementById("bajada").value.trim(),
      cuerpo: document.getElementById("cuerpo").value.trim(),
      categoria: document.getElementById("categoria").value,
      localidad: document.getElementById("localidad").value,
      imagen: imagenUrl,
      fecha: new Date().toISOString(),
      destacada: document.getElementById("destacada").checked,
      es_columna: document.getElementById("esColumna").checked,
      autor_id: document.getElementById("esColumna").checked ? (document.getElementById("autorId").value.trim() || null) : null,
      es_carta: document.getElementById("esCarta").checked,
      autor_nombre: document.getElementById("esCarta").checked ? (document.getElementById("autorNombre").value.trim() || null) : null
    };

    const { error: errorInsert } = await sbClient.from("notas").insert([nota]);
    if (errorInsert) throw errorInsert;

    estado.className = "estado ok";
    estado.textContent = "Nota publicada. Ya está visible en el sitio.";
    document.getElementById("titulo").value = "";
    document.getElementById("bajada").value = "";
    document.getElementById("cuerpo").value = "";
    document.getElementById("imagen").value = "";
    document.getElementById("destacada").checked = false;
  } catch (err) {
    estado.className = "estado error";
    estado.textContent = "Error al publicar: " + (err.message || err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Publicar nota";
  }
});
</script>
</body>
</html>
