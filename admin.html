<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar nota — 3804 Noticias</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .form-wrap{max-width:640px;margin:0 auto;padding:16px;}
  label{display:block;font-size:12px;color:var(--text-secondary);margin:14px 0 4px;}
  input[type=text],input[type=url],input[type=file],textarea,select{
    width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:var(--radius);font-size:14px;font-family:inherit;
  }
  textarea{min-height:110px;resize:vertical;}
  .fila-check{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .fila-check input{width:auto;}
  button.accion{
    margin-top:16px;background:var(--red);color:#fff;border:none;
    padding:11px 16px;border-radius:var(--radius);font-size:14px;cursor:pointer;margin-right:8px;
  }
  button.accion:disabled{opacity:0.5;}
  .aviso{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
    padding:12px;font-size:13px;color:var(--text-secondary);margin-bottom:10px;}
  .estado{margin-top:14px;font-size:13px;padding:10px;border-radius:var(--radius);display:none;}
  .estado.ok{display:block;background:var(--bg-card);color:#4ade80;border:1px solid #4ade80;}
  .estado.error{display:block;background:var(--bg-card);color:var(--red);border:1px solid var(--red);}
</style>
</head>
<body>

<header class="masthead">
  <div class="container">
    <a href="index.html" class="logo">380<span class="num4">4</span><span class="marca">Noticias</span> <span class="marca">· Carga</span></a>
  </div>
</header>

<div class="form-wrap">
  <div class="aviso">
    Completá el formulario y tocá "Publicar nota" — se guarda directo en el sitio, sin pasos extra.
  </div>

  <label>Título</label>
  <input type="text" id="titulo">

  <label>Bajada (una línea, resumen corto)</label>
  <input type="text" id="bajada">

  <label>Cuerpo (podés usar párrafos &lt;p&gt;...&lt;/p&gt;)</label>
  <textarea id="cuerpo"></textarea>

  <label>Categoría</label>
  <select id="categoria">
    <option>Política</option>
    <option>Judiciales</option>
    <option>Economía</option>
    <option>Sociedad</option>
    <option>Deportes</option>
    <option>Cultura</option>
    <option>Opinión</option>
  </select>

  <label>Localidad</label>
  <select id="localidad">
    <option>La Rioja Capital</option>
    <option>Sanagasta</option>
    <option>Chilecito</option>
    <option>Villa Unión</option>
    <option>Villa Castelli</option>
    <option>Vinchina</option>
    <option>Famatina</option>
    <option>Chañarmuyo</option>
    <option>Aimogasta</option>
    <option>San Blas de los Sauces</option>
    <option>Castro Barros</option>
    <option>Chamical</option>
    <option>Chepes</option>
    <option>Ulapes</option>
    <option>Otra</option>
  </select>

  <label>Foto de la nota</label>
  <input type="file" id="imagen" accept="image/*">

  <div class="fila-check">
    <input type="checkbox" id="destacada">
    <label style="margin:0;">Marcar como nota destacada de portada</label>
  </div>

  <div class="fila-check">
    <input type="checkbox" id="esColumna">
    <label style="margin:0;">Es una columna de opinión</label>
  </div>

  <label id="label-autor" style="display:none;">ID del columnista (ver tabla columnistas)</label>
  <input type="text" id="autorId" style="display:none;" placeholder="autor-001">

  <div>
    <button class="accion" id="publicar">Publicar nota</button>
  </div>

  <div class="estado" id="estado"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-init.js"></script>
<script>
document.getElementById("esColumna").addEventListener("change", (e) => {
  document.getElementById("label-autor").style.display = e.target.checked ? "block" : "none";
  document.getElementById("autorId").style.display = e.target.checked ? "block" : "none";
});

document.getElementById("publicar").addEventListener("click", async () => {
  const btn = document.getElementById("publicar");
  const estado = document.getElementById("estado");
  estado.className = "estado";
  estado.textContent = "";

  const titulo = document.getElementById("titulo").value.trim();
  if (!titulo) {
    estado.className = "estado error";
    estado.textContent = "Falta el título.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Publicando...";

  try {
    let imagenUrl = "";
    const archivo = document.getElementById("imagen").files[0];
    if (archivo) {
      const nombreArchivo = `${Date.now()}-${archivo.name.replace(/\s+/g, "-")}`;
      const { error: errorSubida } = await sbClient.storage.from("IMG").upload(nombreArchivo, archivo);
      if (errorSubida) throw errorSubida;
      const { data: urlData } = sbClient.storage.from("IMG").getPublicUrl(nombreArchivo);
      imagenUrl = urlData.publicUrl;
    }

    const id = "nota-" + Date.now();
    const nota = {
      id,
      titulo,
      bajada: document.getElementById("bajada").value.trim(),
      cuerpo: document.getElementById("cuerpo").value.trim(),
      categoria: document.getElementById("categoria").value,
      localidad: document.getElementById("localidad").value,
      imagen: imagenUrl,
      fecha: new Date().toISOString(),
      destacada: document.getElementById("destacada").checked,
      es_columna: document.getElementById("esColumna").checked,
      autor_id: document.getElementById("esColumna").checked ? (document.getElementById("autorId").value.trim() || null) : null
    };

    const { error: errorInsert } = await sbClient.from("notas").insert([nota]);
    if (errorInsert) throw errorInsert;

    estado.className = "estado ok";
    estado.textContent = "Nota publicada. Ya está visible en el sitio.";
    document.getElementById("titulo").value = "";
    document.getElementById("bajada").value = "";
    document.getElementById("cuerpo").value = "";
    document.getElementById("imagen").value = "";
    document.getElementById("destacada").checked = false;
  } catch (err) {
    estado.className = "estado error";
    estado.textContent = "Error al publicar: " + (err.message || err);
  } finally {
    btn.disabled = false;
    btn.textContent = "Publicar nota";
  }
});
</script>
</body>
</html>
